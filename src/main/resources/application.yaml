spring:
  application:
    name: kafka-camel-consumer

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%-5level] [%thread] [%logger]: %msg%n"
  level:
    org.apache.camel: INFO

---
spring:
  profiles: development

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://<host>:<port>/postgres
    username: postgres
    password: postgres

kafka:  
  inbound:
     endpoint: "kafka:${topicName}?brokers=<host>:<port>"

thread-pooling:
  core-pool-size: 25
  max-pool-size: 200

server:
  tomcat:
    accept-count: 100
    max-connections: 500
    max-threads: 200

topicName: ramesh-topic
maxMessagesPerTask: 10
